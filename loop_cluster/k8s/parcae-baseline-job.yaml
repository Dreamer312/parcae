# Phase 0 baseline: one Parcae (or GPT) pretraining run on a single 8-GPU node.
# Written for a cluster WITHOUT internet: nothing is cloned or downloaded at start-up.
#
# Before applying, the volume mounted at /resource must already hold:
#   /resource/parcae                                  this repo, branch loop-cluster
#   /resource/data/fineweb-edu-shuffled/data/...      sample-100BT/train and val/train
#   /resource/tokenizers/parcae-tokenizer             copy of SandyResearch/parcae-tokenizer
# and `tokenizer_path` in the launch config must point at that tokenizer directory
# (the configs ship with the Hub name, which cannot be resolved offline).
#
# Fill in the four CHANGE-ME values, then:
#   kubectl apply -f loop_cluster/k8s/parcae-baseline-job.yaml
# For the GPT baseline, copy this file and change metadata.name, CONFIG and RUN_NAME
# (launch_configs/parcae/pretrain/gpt-small-140m.yaml / gpt-small-140m).
apiVersion: batch/v1
kind: Job
metadata:
  name: parcae-small-140m
  namespace: CHANGE-ME-namespace
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: CHANGE-ME-registry/parcae-offline:torch2.5   # built from loop_cluster/docker/Dockerfile.offline
          workingDir: /resource/parcae
          env:
            - name: CONFIG
              value: launch_configs/parcae/pretrain/parcae-small-140m.yaml
            - name: RUN_NAME
              value: parcae-small-140m
            - name: NUM_GPUS
              value: "8"
            - name: HF_HOME
              value: /resource/hf-cache
            - name: WANDB_MODE
              value: offline
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              # Registers the repo's packages only; every dependency is already in the image.
              pip install -q --no-deps --no-build-isolation -e .
              bash runs/run_training.sh "$CONFIG" "$RUN_NAME" parcae "$NUM_GPUS"
          resources:
            limits:
              nvidia.com/gpu: 8          # CHANGE-ME if your cluster names the GPU resource differently
          volumeMounts:
            - name: resource
              mountPath: /resource
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: resource
          persistentVolumeClaim:
            claimName: CHANGE-ME-pvc     # holds the repo, dataset, tokenizer and checkpoints
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
